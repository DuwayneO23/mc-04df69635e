<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TARS">
<meta name="theme-color" content="#07080a">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>TARS Drive</title>
<style>
:root {
  --bg: #07080a; --bg2: #0c0e11; --card: #111317; --card2: #171a1f; --line: rgba(255,255,255,.075); --line2: rgba(255,255,255,.14);
  --ink: #f2efe8; --dim: #9aa0a7; --faint: #5d636a; --amber: #ffb547; --amber-ink: #1a1206; --ok: #55d68a; --bad: #ff6b5b; --cool: #cfe6ff;
  --metal-a: #34383e; --metal-b: #191b1f; --face: #0a0c0e; --glow: rgba(255,181,71,.55);
  --r: 22px; --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
}
/* night: "Interstellar". Deep space blue-black, icy white, TARS's warm amber. Still dim enough not to glare in the car. */
html[data-theme="night"] {
  --bg: #02040a; --bg2: #060a14; --card: #0a101c; --card2: #0f1727; --line: rgba(150,190,255,.085); --line2: rgba(150,190,255,.17);
  --ink: #dbe5f4; --dim: #8796ae; --faint: #4b586d; --amber: #ffb547; --amber-ink: #1a1206; --ok: #6be3b5; --bad: #ff6b5b; --cool: #a9d8ff;
  --metal-a: #222b3b; --metal-b: #0c111a; --face: #04070d; --glow: rgba(255,181,71,.5);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: manipulation; }
body { font: 16px/1.35 var(--sans); -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%;
  transition: background-color .8s, color .8s; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); -webkit-user-select: text; user-select: text; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
[hidden] { display: none !important; }

/* ---------- home ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 16px); }
.top { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.top .date { color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 15px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip svg.i { width: 18px; height: 18px; }
.chip .warn { color: var(--amber); }
#linkdot { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); }
#linkdot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 3px transparent; transition: background .3s, box-shadow .3s; }
#linkdot.ok::after { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
#linkdot.bad::after { background: var(--bad); }
#linkdot.busy::after { background: var(--amber); }

.hero { display: flex; flex-direction: column; gap: 2px; }
.clock { font: 200 clamp(76px, 25vw, 124px)/.86 var(--display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; margin-left: -4px; }
.clock small { font-size: .32em; font-weight: 300; letter-spacing: 0; color: var(--dim); margin-left: .25em; vertical-align: .9em; }
.sub { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); font-size: 14px; min-height: 19px; }
.sub b { color: var(--ink); font-weight: 600; }
.setupbar { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 15px; flex: none;
  background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); font-size: 13px; font-weight: 700; white-space: nowrap; }

/* the TARS card */
.tars { position: relative; flex: 1 1 auto; min-height: 196px; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
  column-gap: 20px; row-gap: 12px; align-items: center; padding: 16px 16px 16px 20px;
  border-radius: 28px; background: linear-gradient(160deg, var(--card2), var(--card) 60%); border: 1px solid var(--line); overflow: hidden; cursor: pointer; }
.tars::before { content: ""; position: absolute; inset: auto -20% -60% 10%; height: 120%; background: radial-gradient(closest-side, var(--glow), transparent);
  opacity: 0; transition: opacity .6s; pointer-events: none; }
.tars.listening::before, .tars.speaking::before { opacity: .22; }
.tars.thinking::before { opacity: .1; }
.monolith { position: relative; display: flex; gap: 3px; height: min(clamp(116px, 21vh, 196px), 100%); aspect-ratio: .74; transition: height .35s; align-self: center; }
.tars.has-action .monolith { height: min(clamp(96px, 14vh, 140px), 100%); }
.slab { position: relative; flex: 1; border-radius: 4px 4px 3px 3px; overflow: hidden;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
    linear-gradient(90deg, rgba(255,255,255,.10), rgba(255,255,255,0) 22%, rgba(255,255,255,0) 70%, rgba(0,0,0,.35)),
    linear-gradient(180deg, var(--metal-a), var(--metal-b));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 22px rgba(0,0,0,.55); transition: transform .5s cubic-bezier(.3,.7,.3,1); }
.slab i { position: absolute; left: 50%; bottom: 7%; width: 3px; height: 46%; margin-left: -1.5px; border-radius: 2px; background: var(--amber);
  transform-origin: 50% 100%; transform: scaleY(var(--lv, .12)); opacity: calc(.25 + var(--lv, .12) * .75);
  box-shadow: 0 0 10px var(--glow); }
.tars.speaking .slab i { background: var(--cool); box-shadow: 0 0 10px rgba(207,230,255,.55); }
.face { position: absolute; left: 22%; right: 22%; top: 13%; height: 17%; min-height: 20px; border-radius: 3px; background: var(--face);
  border: 1px solid rgba(255,255,255,.09); display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8%; overflow: hidden; }
.face b { display: block; height: 2px; border-radius: 1px; background: var(--ink); opacity: .85; transition: width .4s; }
.face b:nth-child(1) { width: 70%; } .face b:nth-child(2) { width: 42%; opacity: .55; }
.tars.listening .face b { background: var(--amber); }
.tars.thinking .face b:nth-child(1) { animation: scan 1.1s ease-in-out infinite; }
.tars.thinking .face b:nth-child(2) { animation: scan 1.1s ease-in-out -.55s infinite; }
@keyframes scan { 0%,100% { width: 18%; } 50% { width: 82%; } }
.tars.thinking .slab { animation: walk 1.3s ease-in-out infinite; }
.tars.thinking .slab:nth-child(2) { animation-delay: .12s; } .tars.thinking .slab:nth-child(3) { animation-delay: .24s; } .tars.thinking .slab:nth-child(4) { animation-delay: .36s; }
@keyframes walk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.tars.error .face b { background: var(--bad); }

.readout { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center; align-self: stretch; min-height: 0; overflow: hidden; }
.readout > * { flex-shrink: 0; }
.readout > .reply { flex-shrink: 1; }
.readout.tight { justify-content: flex-start; gap: 5px; }
.readout.tight .said { -webkit-line-clamp: 1; max-height: 1.3em; }
.status { color: var(--dim); display: flex; align-items: center; gap: 8px; }
.status .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.tars.listening .status { color: var(--amber); } .tars.listening .status .pip { background: var(--amber); animation: blink 1s steps(2) infinite; }
.tars.thinking .status .pip { background: var(--ink); animation: blink .6s steps(2) infinite; }
.tars.speaking .status { color: var(--ink); } .tars.speaking .status .pip { background: var(--cool); }
.tars.error .status { color: var(--bad); } .tars.error .status .pip { background: var(--bad); }
@keyframes blink { 50% { opacity: .2; } }
.said { color: var(--dim); font-size: 15px; line-height: 1.3; max-height: 2.6em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.said:empty { display: none; }
.reply { font: 500 clamp(19px, 5.4vw, 24px)/1.28 var(--display); letter-spacing: -.01em; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.reply::-webkit-scrollbar { display: none; }
.reply.scrolls { -webkit-mask-image: linear-gradient(transparent, #000 10px, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(transparent, #000 10px, #000 calc(100% - 14px), transparent); }
.reply .w { transition: opacity .2s ease, color .45s ease; }
.reply .w.up { opacity: .1; }
.reply .w.cur { color: var(--amber); }
.reply.hint { color: var(--dim); font-weight: 400; }
.reply.err { color: var(--bad); }
.action { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 20px; background: var(--bg2); border: 1px solid var(--line2);
  animation: rise .35s cubic-bezier(.2,.8,.3,1); cursor: default; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.action .what { flex: 1; min-width: 0; }
.action .what div:first-child { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action .what div:last-child { color: var(--dim); font-size: 13px; }
.action .go { height: 52px; min-width: 88px; padding: 0 18px; border-radius: 15px; background: var(--amber); color: var(--amber-ink); font-weight: 800; font-size: 17px; letter-spacing: .04em; }
.action .x { width: 40px; height: 52px; display: grid; place-items: center; color: var(--dim); }
.action .alt { height: 52px; padding: 0 12px; border-radius: 15px; background: var(--card2); font-weight: 600; font-size: 14px; }

.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
  padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); -webkit-overflow-scrolling: touch; flex: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 15px; white-space: nowrap; }
.quick button:disabled { opacity: .4; }

.group { display: flex; flex-direction: column; gap: 7px; flex: none; }
.group .label { color: var(--faint); padding-left: 4px; }
.group .label span { color: var(--faint); opacity: .8; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 64px; gap: 8px; }
.tile { position: relative; height: 82px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between;
  align-items: flex-start; padding: 11px 11px 10px; text-align: left; overflow: hidden; transition: transform .12s, background .2s; }
.tile:active, .quick button:active, .chip:active, .btn:active, .action .go:active { transform: scale(.96); }
.tile svg.i { width: 24px; height: 24px; }
.tile .n { font-weight: 700; font-size: 15px; line-height: 1.15; width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.tile.more { align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; text-align: center; }
.tile.more .n { font-size: 11px; font-weight: 600; color: var(--dim); text-align: center; -webkit-line-clamp: 1; }
.tile .s { font-size: 11px; color: var(--dim); width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.ghost { background: transparent; border-style: dashed; border-color: var(--line2); color: var(--dim); }
.tile.hot svg.i { color: var(--amber); }

.np { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 8px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; }
.np .art { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--card2); flex: none; }
.np .art.none { display: grid; place-items: center; color: var(--faint); }
.np .meta { flex: 1; min-width: 0; }
.np .meta .t { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .meta .s { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .npb { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--card2); flex: none; }
.np .npb.big { width: 54px; background: var(--ink); color: var(--bg); }
.np .npb:active { transform: scale(.94); }
.np .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--amber); width: 0; transition: width 1s linear; opacity: .8; }
.np.idle .npb { opacity: .45; }
.bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; flex: none; }
.drive, .menu { display: flex; align-items: center; gap: 10px; }
.speed { display: flex; align-items: baseline; gap: 5px; min-width: 76px; }
.speed b { font: 300 34px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.speed span { color: var(--dim); font-size: 12px; }
#mode { height: 30px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line2); color: var(--dim); }
#mode.driving { color: var(--amber-ink); background: var(--amber); border-color: transparent; }
.iconbtn { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--dim); }

/* short screens: fitLayout() adds c1, then c2, then c3 until everything fits */
@media (orientation: portrait) {
  #app.c1 { gap: 9px; }
  #app.c1 .clock { font-size: clamp(64px, 21vw, 98px); }
  #app.c1 .tile { height: 70px; }
  #app.c1 .np .art { width: 42px; height: 42px; }
  #app.c1 .np .npb { width: 42px; height: 42px; } #app.c1 .np .npb.big { width: 48px; }
  #app.c2 .sub { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  #app.c2 .tile, #app.c2 .tile.more { height: 52px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; padding: 0 10px; border-radius: 16px; }
  #app.c2 .tile .n { -webkit-line-clamp: 1; font-size: 13.5px; }
  #app.c2 .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)) 46px; }
  #app.c2 .tile:not(.more) svg.i { display: none; }
  #app.c2 .tile svg.i { width: 20px; height: 20px; }
  #app.c2 .tile.more { justify-content: center; padding: 0; } #app.c2 .tile.more .n { display: none; }
  #app.c2 .quick button { height: 40px; }
  #app.c2 .np { padding: 5px; } #app.c2 .np .art { width: 38px; height: 38px; }
  #app.c3 .group .label { display: none; }
  #app.c3 .clock { font-size: clamp(56px, 17vw, 82px); }
  #app.c3 .bottom { min-height: 42px; } #app.c3 .iconbtn { width: 42px; height: 42px; border-radius: 14px; }
  #app.c3 .speed b { font-size: 28px; }
}

/* landscape on a phone, the way it sits in the car: an instrument column on the left (clock, date, the chips, speed),
   TARS in the middle, GO and music on the right, quick asks and the menu along the bottom */
@media (orientation: landscape) and (max-height: 520px) {
  #app { display: grid; grid-template-columns: minmax(0, .74fr) minmax(0, 1.5fr) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "hero tars groups" "status tars groups" "dash tars groups" "drive quick menu";
    column-gap: 14px; row-gap: 8px;
    padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px); }
  .hero { grid-area: hero; container-type: inline-size; gap: 4px; min-width: 0; }
  .clock { font-size: min(39cqw, 96px); margin-left: -2px; }
  .sub { font-size: 12.5px; gap: 2px 10px; min-height: 0; }
  .top { grid-area: status; flex-wrap: wrap; align-content: flex-start; align-items: center; gap: 6px; min-height: 0; overflow: hidden; }
  .top .date { flex: 1 0 100%; order: -1; }
  .tars { grid-area: tars; min-height: 0; padding: 14px 14px 14px 18px; column-gap: 16px; }
  .monolith, .tars.has-action .monolith { height: clamp(90px, 30vh, 150px); }
  .reply { font-size: 19px; }
  .said { font-size: 13.5px; }
  .action { padding: 6px 6px 6px 12px; }
  .action .go, .action .alt, .action .x { height: 46px; }
  .quick { grid-area: quick; margin: 0; padding: 0; align-self: center; }
  .quick button { height: 42px; font-size: 14px; padding: 0 14px; }
  .groups { grid-area: groups; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; }
  .group { gap: 5px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .tile, .tile.more { height: 52px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 9px; padding: 0 11px; border-radius: 16px; text-align: left; }
  .tile svg.i { width: 21px; height: 21px; }
  .tile .s { display: none; }
  .tile .n, .tile.more .n { font-size: 14px; -webkit-line-clamp: 1; color: inherit; text-align: left; font-weight: 700; }
  .bottom { display: contents; }
  .drive { grid-area: drive; }
  .menu { grid-area: menu; justify-content: flex-end; gap: 8px; }
  .iconbtn { width: 42px; height: 42px; border-radius: 14px; }
  #modebtn span { display: none; }
  #modebtn { padding: 0; width: 42px; justify-content: center; }
  .speed b { font-size: 30px; }
  .np { padding: 6px; gap: 8px; }
  .np .art, .np .art.none { display: none; }
  .np .meta { padding-left: 6px; }
  .np .npb { width: 40px; height: 40px; border-radius: 12px; }
  .np .npb.big { width: 46px; }
  .np .meta .t { font-size: 13.5px; } .np .meta .s { font-size: 11.5px; }
  html:not(.home) #dash { display: flex; }
  #dash { grid-area: dash; flex-direction: column; justify-content: flex-end; gap: 3px; min-height: 0; overflow: hidden; padding-bottom: 2px; }
  .dspd { display: flex; align-items: baseline; gap: 6px; }
  .dspd b { font: 200 clamp(56px, 18vh, 86px)/.9 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .dspd span { color: var(--dim); font-size: 14px; }
  .dpark { font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
  .dsub { color: var(--dim); font-size: 13px; }
  .drive .speed { display: none; }
  .np.idle .meta .s { display: none; }
  #app.l1 .group .label { display: none; }
  #app.l1 .tile, #app.l1 .tile.more { height: 46px; }
  #app.l2 .tile, #app.l2 .tile.more { height: 40px; border-radius: 13px; }
  #app.l2 .np .art { width: 34px; height: 34px; }
  #app.l2 .np .npb { width: 36px; height: 36px; }
}
@media (orientation: portrait), (min-height: 521px) { .groups { display: contents; } }

/* ---------- Home mode (html.home): the phone on its stand at home. Gargantua fills the screen; the time, one line
   about the car and Claude usage float on it, and a tap anywhere talks to TARS. Nothing else. ---------- */
#hole, #hdate, #hicons, #hcar, #husage, #modebtn, #dash { display: none; }
#hole { background: #000; }
#hole.flat { background: radial-gradient(circle at 50% 44%, #000 0 11%, #fff3dc 11.5%, #ffb547 12.6%, rgba(255,140,40,.3) 18%, transparent 30%),
  linear-gradient(transparent 43.4%, rgba(255,190,90,.55) 44.2%, rgba(255,190,90,.55) 44.8%, transparent 45.6%), #02040a; }
#modebtn { width: auto; padding: 0 14px; gap: 8px; font-weight: 700; font-size: 14px; color: var(--ink); }
#modebtn svg.i { width: 20px; height: 20px; color: var(--amber); }
#app.stopped #modebtn { display: inline-flex; align-items: center; }
#app.stopped .drive .speed { display: none; }
html.home #hole { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; }
html.home #app { display: block; }
html.home #app > .top, html.home #app > .quick, html.home #app > .groups, html.home #app > .bottom { display: none !important; }
html.home .orb { animation-play-state: paused; }
html.fx.boot.home .tars, html.fx.boot.home .hero { animation: none; }
html.home .hero { position: absolute; top: calc(env(safe-area-inset-top) + 16px); left: calc(env(safe-area-inset-left) + 24px); gap: 6px; text-shadow: 0 2px 24px rgba(0,0,0,.65);
  container-type: normal; white-space: nowrap; }
html.home .clock { font-size: clamp(56px, 15vmin, 92px); font-weight: 200; color: #eef3fb; }
html.home .sub { display: none; }

html.home #hcar { display: flex; position: absolute; left: calc(env(safe-area-inset-left) + 24px); bottom: calc(env(safe-area-inset-bottom) + 20px); max-width: 46vw;
  align-items: center; gap: 9px; color: #c9d6ea; font-size: 15px; line-height: 1.3; text-shadow: 0 1px 12px rgba(0,0,0,.85); }

html.home .tars { position: absolute; left: 0; right: 0; margin: 0 auto; bottom: calc(env(safe-area-inset-bottom) + 78px); width: min(620px, 70vw);
  min-height: 0; display: block; padding: 0; background: none; border: 0; overflow: visible; cursor: default; }
html.home .tars::before, html.home .monolith { display: none; }
html.fx.home .tars, html.fx.home .tars.listening, html.fx.home .tars.speaking { background: none; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
html.home .readout { align-items: center; text-align: center; gap: 6px; overflow: visible; padding: 14px 18px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0,0,0,.62), rgba(0,0,0,.38) 60%, transparent); }

  html.home .tars { width: 88vw; bottom: calc(env(safe-area-inset-bottom) + 112px); }
  html.home .reply { max-height: 3.9em; }
  html.home #hcar { max-width: calc(100vw - 236px); font-size: 14px; }
}
/* night at home: after three quiet minutes everything but the clock and the black hole fades right down */
html.home .hero, html.home #hicons, html.home #hcar, html.home #husage, html.home .readout { transition: opacity 1.4s ease; }
html.ambient.home #hicons, html.ambient.home #hcar, html.ambient.home #husage { opacity: .12; }

/* ---------- effects: Settings → Look → Effects (html.fx). Slow and quiet, made for the car. ---------- */
:root { --sky-a: rgba(255,181,71,.13); --sky-b: rgba(70,130,255,.10); --star-o: 0; }
html[data-sky="dawn"] { --sky-a: rgba(255,150,90,.18); --sky-b: rgba(150,110,255,.11); --star-o: .25; }
html[data-sky="golden"] { --sky-a: rgba(255,138,50,.24); --sky-b: rgba(255,80,96,.12); --star-o: .12; }
html[data-sky="night"] { --sky-a: rgba(255,110,60,.11); --sky-b: rgba(46,74,170,.13); --star-o: .75; }
html[data-wet] { --sky-b: rgba(90,165,230,.19); }
html[data-theme="night"] { --sky-a: rgba(255,160,70,.10); --sky-b: rgba(55,100,255,.18); }
#sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: none; }
html.fx #sky { display: block; }
#app { z-index: 1; }
.orb { position: absolute; width: 95vmax; height: 95vmax; border-radius: 50%; will-change: transform; transition: background 4s; }
.orb.a { top: -48vmax; right: -42vmax; background: radial-gradient(closest-side, var(--sky-a), transparent); animation: drift-a 84s ease-in-out infinite alternate; }
.orb.b { bottom: -52vmax; left: -46vmax; background: radial-gradient(closest-side, var(--sky-b), transparent); animation: drift-b 101s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(-13vmax, 11vmax) scale(1.12); } }
@keyframes drift-b { to { transform: translate(11vmax, -9vmax) scale(1.16); } }
#stars { position: absolute; inset: 0 0 50% 0; opacity: var(--star-o); transition: opacity 4s; -webkit-mask-image: linear-gradient(#000 35%, transparent); mask-image: linear-gradient(#000 35%, transparent); }
#stars i { position: absolute; border-radius: 50%; background: #fff; }
#stars i.tw { animation: twinkle 9s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .75; } 50% { opacity: .12; } }
html[data-theme="night"] #stars i { background: #e2ecff; }
html.fx .tile, html.fx .np, html.fx .chip, html.fx .quick button, html.fx .iconbtn, html.fx #linkdot {
  background: color-mix(in srgb, var(--card) 74%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.055); }
html.fx .tile.ghost { background: transparent; box-shadow: none; }
html.fx .tars { background: linear-gradient(160deg, color-mix(in srgb, var(--card2) 82%, transparent), color-mix(in srgb, var(--card) 68%, transparent) 62%);
  -webkit-backdrop-filter: blur(16px) saturate(1.15); backdrop-filter: blur(16px) saturate(1.15); box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  transition: box-shadow .6s, border-color .6s; }
html.fx .tars.listening { border-color: rgba(255,181,71,.34); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 22px 60px -26px rgba(255,181,71,.55); }
html.fx .tars.speaking { border-color: rgba(207,230,255,.26); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 22px 60px -28px rgba(160,205,255,.5); }
html.fx .monolith { -webkit-box-reflect: below 5px linear-gradient(transparent 64%, rgba(0,0,0,.26)); }
html.fx .tars.has-action .monolith { -webkit-box-reflect: none; }
html.fx .slab::after { content: ""; position: absolute; inset: -10% -80%; pointer-events: none;
  background: linear-gradient(105deg, transparent 44%, rgba(255,255,255,.12) 50%, transparent 56%); transform: translateX(-70%); animation: sheen 12s ease-in-out infinite; }
html.fx .slab:nth-child(2)::after { animation-delay: .18s; } html.fx .slab:nth-child(3)::after { animation-delay: .36s; } html.fx .slab:nth-child(4)::after { animation-delay: .54s; }
@keyframes sheen { 0%, 72% { transform: translateX(-70%); } 88%, 100% { transform: translateX(70%); } }
html.fx .clock { text-shadow: 0 0 46px color-mix(in srgb, var(--amber) 13%, transparent); }
html.fx .clock .colon { animation: colon 2s ease-in-out infinite; }
@keyframes colon { 50% { opacity: .38; } }
#linkdot { position: relative; }
html.fx #linkdot.ok::before { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
  border: 1px solid var(--ok); animation: ping 3.4s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .7; } to { transform: scale(3); opacity: 0; } }
html.fx .tile::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .55s;
  background: radial-gradient(150px circle at var(--px, 50%) var(--py, 50%), rgba(255,255,255,.15), transparent 62%); }
html.fx .tile.pressed::after { opacity: 1; transition: none; }
html.fx .action { border-color: color-mix(in srgb, var(--amber) 24%, var(--line2)); }
html.fx .action .go { box-shadow: 0 10px 28px -8px color-mix(in srgb, var(--amber) 62%, transparent); }
html.fx .np::before { content: ""; position: absolute; inset: -40%; pointer-events: none; background: var(--art, none) center / cover;
  filter: blur(30px) saturate(1.6); opacity: .3; transition: opacity .8s; }
.np > *:not(.bar) { position: relative; z-index: 1; } .np .bar { z-index: 2; }
html.fx .np .bar { box-shadow: 0 0 10px var(--amber); }
html.fx.boot .top, html.fx.boot .hero, html.fx.boot .tars, html.fx.boot .quick, html.fx.boot .group, html.fx.boot .bottom { animation: enter .75s cubic-bezier(.2,.8,.2,1) both; }
html.fx.boot .hero { animation-delay: .05s; } html.fx.boot .tars { animation-delay: .12s; } html.fx.boot .quick { animation-delay: .2s; }
html.fx.boot .group { animation-delay: .26s; } html.fx.boot .group + .group { animation-delay: .32s; } html.fx.boot .bottom { animation-delay: .38s; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) {
  html.fx .orb, html.fx #stars i, html.fx .slab::after, html.fx .clock .colon, html.fx #linkdot.ok::before { animation: none !important; }
  html.fx.boot .top, html.fx.boot .hero, html.fx.boot .tars, html.fx.boot .quick, html.fx.boot .group, html.fx.boot .bottom { animation: none !important; }
}

/* ---------- dash cam: the REC light, Save clip, the save flash, the Dash cam sheet ---------- */
.camchip { gap: 7px; padding: 0 10px; font: 700 11.5px/1 var(--mono); letter-spacing: .1em; }
.camchip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.camchip.rec .dot { background: #ff453a; box-shadow: 0 0 8px rgba(255,69,58,.75); animation: recdot 1.8s ease-in-out infinite; }
.camchip.paused .dot, .camchip.starting .dot { background: var(--amber); }
.camchip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.camchip.bad .dot { background: var(--bad); }
.camchip .el { color: var(--dim); font-weight: 600; }
@keyframes recdot { 50% { opacity: .3; } }
@media (max-width: 389px) { .camchip .el { display: none; } }
@media (orientation: portrait) {   /* setup chip + REC light + weather leave no room for the date: hide it rather than show "WE…" */
  .top:has(.setupbar:not([hidden])):has(.camchip:not([hidden])) .date { visibility: hidden; } }
.quick button.camsave { display: inline-flex; align-items: center; gap: 8px; border-color: color-mix(in srgb, #ff453a 42%, transparent); }
.quick button.camsave i { width: 9px; height: 9px; border-radius: 50%; background: #ff453a; box-shadow: 0 0 8px rgba(255,69,58,.6); }
#camflash { position: fixed; inset: 0; z-index: 45; pointer-events: none; opacity: 0; transition: opacity .9s ease-out;
  box-shadow: inset 0 0 0 6px var(--amber), inset 0 0 70px color-mix(in srgb, var(--amber) 45%, transparent); }
#camflash.on { opacity: 1; transition: none; }
html.camrec .orb { animation-play-state: paused; }   /* the camera works the phone hard enough: the sky holds still while it records */
.aim { position: relative; margin-top: 10px; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
.aim video { width: 100%; height: 100%; object-fit: contain; display: block; }
.aim i { position: absolute; left: 6%; right: 6%; top: 40%; border-top: 1.5px dashed rgba(255,255,255,.7); }
.aim i::after { content: "horizon"; position: absolute; right: 0; top: 3px; font: 600 10px var(--mono); letter-spacing: .1em; color: rgba(255,255,255,.75); text-transform: uppercase; }
.camplayer { width: 100%; max-height: 52vh; border-radius: 12px; background: #000; margin-top: 8px; display: block; }
.camrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
.camrow:last-child { border-bottom: 0; }
.camrow .t { font-weight: 650; }
.camrow .s { color: var(--dim); font-size: 13px; margin-top: 2px; }
.camrow .acts { margin-top: 8px; }
.camdrive { color: var(--faint); margin: 16px 0 0; }
.camset { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.camset .u { color: var(--dim); font-size: 13px; }
.camset small { display: block; color: var(--dim); font-size: 12.5px; }
.camset .field { width: 96px; flex: none; margin: 0; text-align: right; }
.camdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 9px; background: var(--faint); vertical-align: 1px; }
.camdot.rec { background: #ff453a; box-shadow: 0 0 10px rgba(255,69,58,.7); }
.camdot.paused, .camdot.starting { background: var(--amber); }
.camdot.bad { background: var(--bad); }

@media (prefers-reduced-motion: reduce) { .camchip.rec .dot { animation: none; } }

/* ---------- sheets ---------- */
.sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }
.sheet header { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px); border-bottom: 1px solid var(--line); }
.sheet header h2 { margin: 0; flex: 1; font: 700 22px/1.2 var(--display); letter-spacing: -.01em; }

.btn { height: 46px; padding: 0 18px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 650; }
.row .s { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.field { display: block; width: 100%; height: 46px; margin-top: 8px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); }
textarea.field { height: auto; min-height: 64px; padding: 10px 12px; resize: vertical; }
select.field { -webkit-appearance: none; appearance: none; }
.seg { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 70px; height: 40px; border-radius: 11px; background: var(--bg2); border: 1px solid var(--line2); font-weight: 600; font-size: 14px; }
.seg button.on { background: var(--amber); color: var(--amber-ink); border-color: transparent; }
input[type=range] { width: 100%; margin-top: 12px; accent-color: var(--amber); }
.badge { display: inline-block; min-width: 54px; text-align: center; padding: 3px 8px; border-radius: 8px; font: 700 11px/1.4 var(--mono); letter-spacing: .08em; background: var(--card2); color: var(--dim); }
.badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.badge.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.step { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.step .num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); font-weight: 700; font-size: 14px; }
.step.done .num { background: var(--ok); color: #04150b; }
.step .grow { flex: 1; min-width: 0; }
ol.how { margin: 8px 0 0; padding-left: 20px; color: var(--dim); font-size: 14px; line-height: 1.5; }
ol.how b { color: var(--ink); }
.meter { height: 8px; border-radius: 4px; background: var(--bg2); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .08s; }
.empty { color: var(--dim); text-align: center; padding: 26px 10px; }
.hist .q { color: var(--dim); font-size: 14px; }
.hist .a { margin-top: 4px; }
.hist .m { color: var(--faint); font: 600 11px var(--mono); letter-spacing: .08em; margin-top: 6px; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translate(-50%, 20px); z-index: 30; max-width: 88vw; padding: 12px 18px; border-radius: 16px;
  background: rgba(20,22,26,.94); border: 1px solid var(--line2); font-weight: 600; font-size: 15px; text-align: center; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;

#modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 24px; }
#modal .box { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line2); border-radius: 24px; padding: 20px; }

#modal p { margin: 0; color: var(--dim); }
#modal .acts { margin-top: 16px; }
#modal .acts .btn { flex: 1; }
</style>

<script>
'use strict';
// TARS Drive: the car screen on the iPhone 11. Talk to TARS (the same TARS as Telegram, through the PC over
// Tailscale), with replies spoken back in TARS's own voice; one-tap navigation and music; clock, weather, sunset,

const VERSION = '1.6.1';
const $ = (s, el = document) => el.querySelector(s);

const icon = (id, cls = 'i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const store = {
  get(k, d) { try { const v = localStorage.getItem('drive.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('drive.' + k, JSON.stringify(v)); } catch {} },

const LOG = [];
function log(m) { LOG.push(`${hm(new Date())}:${two(new Date().getSeconds())} ${m}`); if (LOG.length > 300) LOG.splice(0, 100); }
window.addEventListener('error', e => log('JS error: ' + e.message));
window.addEventListener('unhandledrejection', e => log('JS rejection: ' + (e.reason && e.reason.message || e.reason)));

// ---------- settings and saved things ----------
const DEFAULT_CFG = { humor: 75, voice: true, duck: true, fx: true, maps: 'google', theme: 'auto', tg: '', autoHome: true };
const DEFAULT_QUICK = [
  { label: 'Drive home?', text: 'How long is the drive home right now?' },
  { label: "Who's waiting?", text: "Who's waiting on me on WhatsApp?" },
  { label: 'DJ me', text: 'Make me a Spotify playlist for this drive, from my taste and the time of day.' },
  { label: 'My last drive', text: 'How was my last drive?' },
  { label: 'Brief me', text: 'Brief me.' },
  { label: "What's playing?", text: "What's playing on my Spotify right now?" },
];
const cfg = Object.assign({}, DEFAULT_CFG, store.get('cfg', {}));
let places = store.get('places', []);        // {id, name, kind, lat, lon, q}
let music = store.get('music', []);          // pinned {id, name, url}
let fromTars = store.get('fromtars', []);    // playlists TARS sent {url, name, at}
let quick = store.get('quick', DEFAULT_QUICK);
let convos = store.get('history', []);
let checks = store.get('checks', {});        // id -> {ok, detail, at}
const saveCfg = () => store.set('cfg', cfg);
const KIND = { home: { icon: 'home', label: 'Home' }, work: { icon: 'work', label: 'Work' }, gym: { icon: 'gym', label: 'Gym' }, other: { icon: 'pin', label: 'Place' } };
const APPNAME = { google: 'Google Maps', waze: 'Waze', apple: 'Apple Maps' };
const SYN = { home: ['home', 'house', 'my place'], work: ['work', 'office', 'job'], gym: ['gym'] };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- theme, clock, sun ----------
function sunTimes(date, lat, lon, alt = -0.833) {           // from Trail Companion
  const rad = Math.PI / 180, jd0 = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 864e5 + 2440587.5;
  const n = Math.ceil(jd0 - 2451545.0 + 0.0008), Js = n - lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360, Cc = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const lam = (M + Cc + 180 + 102.9372) % 360, Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lam * rad);
  const sd = Math.sin(lam * rad) * Math.sin(23.4397 * rad), cd = Math.cos(Math.asin(sd));
  const cw = (Math.sin(alt * rad) - Math.sin(lat * rad) * sd) / (Math.cos(lat * rad) * cd), w = Math.acos(clamp(cw, -1, 1)) * 180 / Math.PI;
  const toD = j => new Date((j - 2440587.5) * 864e5); return { rise: toD(Jt - w / 360), set: toD(Jt + w / 360) };
}
let area = store.get('area', null);          // last location rounded to ~1 km, only for sunset and weather
function sunNow() {
  if (!area) return null;
  const now = new Date(), t = sunTimes(now, area.lat, area.lon), tm = sunTimes(new Date(now.getTime() + 864e5), area.lat, area.lon);
  const night = now < t.rise || now > t.set;
  const next = now < t.rise ? { k: 'Sunrise', at: t.rise } : now < t.set ? { k: 'Sunset', at: t.set } : { k: 'Sunrise', at: tm.rise };
  return { night, next };
}
function applyTheme() {
  const s = sunNow();
  const night = cfg.theme === 'night' || (cfg.theme === 'auto' && s && s.night);
  const want = night ? 'night' : 'day';
  if (document.documentElement.dataset.theme !== want) document.documentElement.dataset.theme = want;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = night ? '#02040a' : '#07080a';
  skyPhase();
}
function skyPhase() {
  // dawn / day / golden hour / night from the real sunrise and sunset; data-wet when it's raining
  const html = document.documentElement;
  let phase = 'day';
  if (area) {
    const now = new Date(), t = now.getTime(), st = sunTimes(now, area.lat, area.lon), rise = st.rise.getTime(), set = st.set.getTime();
    if (t < rise - 30 * 60e3 || t > set + 40 * 60e3) phase = 'night';
    else if (t < rise + 50 * 60e3) phase = 'dawn';
    else if (t > set - 70 * 60e3) phase = 'golden';
  }
  if (html.dataset.sky !== phase) html.dataset.sky = phase;
  const c = WX.now && Date.now() - WX.at < 3 * 3600e3 ? WX.now.code : -1;
  const wet = !!(WX.now && WX.now.rainAt === 'now') || (c >= 51 && c <= 67) || (c >= 80 && c <= 99);
  if (wet) html.setAttribute('data-wet', ''); else html.removeAttribute('data-wet');
}
(function stars() {
  // a fixed sky (seeded, so the stars don't jump around between launches): a few twinkle, slowly
  let seed = 20261021, h = '';
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 44; i++) {
    const x = (rnd() * 100).toFixed(2), y = (rnd() * 100).toFixed(2), z = rnd() < .14 ? 2 : 1, o = (.22 + rnd() * .58).toFixed(2);
    const tw = i % 4 === 0;
    h += `<i${tw ? ' class="tw"' : ''} style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;opacity:${o}${tw ? `;animation-duration:${(7 + rnd() * 7).toFixed(1)}s;animation-delay:-${(rnd() * 9).toFixed(1)}s` : ''}"></i>`;
  }
  document.getElementById('stars').innerHTML = h;
})();
const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'], MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
let lastMinute = -1;
function tick() {
  const now = new Date();
  if (now.getMinutes() !== lastMinute) {
    lastMinute = now.getMinutes();
    $('#clock').innerHTML = `${two(now.getHours())}<span class="colon">:</span>${two(now.getMinutes())}`;
    $('#date').textContent = $('#hdate').textContent = `${DAYS[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]}`;
    renderSub(); applyTheme();
  }
  renderSpeed();
  camOfferTick(); modeTick(); ambientTick();
}
const landscape = () => matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
function dur(ms) { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${two(m % 60)}`; }
function renderSub() {
  const parts = [], s = sunNow(), t = G.trip;
  if (t && Date.now() - t.end < 180000 && t.end - t.start > 60000 && !landscape()) parts.push(`Trip <b>${dur(t.end - t.start)}</b> · ${(t.m / 1000).toFixed(1)} km`);   // landscape: in the speed panel
  if (s) { const left = s.next.at - Date.now(); parts.push(`${s.next.k} <b>${hm(s.next.at)}</b>${left < 3 * 3600e3 ? ' · in ' + dur(left) : ''}`); }
  if (WX.now) {
    const r = WX.now.rainAt;
    if (r) parts.push(r === 'now' ? '<b>Raining</b>' : `Rain likely from <b>${r}</b>`);
  }
  $('#sub').innerHTML = parts.join('<span>·</span>') || '&nbsp;';
  fitSoon();
}

// ---------- GPS: speed, driving or parked, trip ----------
const G = { id: null, fix: null, prev: null, moving: false, fastSince: 0, slowSince: 0, trip: null, manual: null, denied: false };
function gpsOn() {
  if (G.id !== null || !navigator.geolocation) return;
  G.id = navigator.geolocation.watchPosition(onFix, e => { if (e.code === 1) G.denied = true; log('GPS error ' + e.code + ' ' + e.message); renderSpeed(); },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 30000 });
}
function gpsOff() { if (G.id !== null) navigator.geolocation.clearWatch(G.id); G.id = null; }
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function onFix(p) {
  const c = p.coords, f = { t: Date.now(), lat: c.latitude, lon: c.longitude, acc: c.accuracy, spd: c.speed != null && c.speed >= 0 ? c.speed : null };
  G.denied = false;
  camGps(c);
  if (f.spd == null && G.fix && f.acc < 30 && G.fix.acc < 30 && f.t > G.fix.t) f.spd = dist(G.fix, f) / ((f.t - G.fix.t) / 1000);
  if (G.trip && G.fix && f.acc < 35 && G.fix.acc < 35) { const d = dist(G.fix, f); if (d < 400) G.trip.m += d; }
  G.prev = G.fix; G.fix = f;
  const kmh = (f.spd || 0) * 3.6, now = f.t;
  if (kmh >= 15) { G.fastSince = G.fastSince || now; G.slowSince = 0; } else { G.fastSince = 0; if (kmh < 5) G.slowSince = G.slowSince || now; else G.slowSince = 0; }
  if (!G.moving && G.fastSince && now - G.fastSince > 5000) { G.moving = true; if (!G.trip || now - G.trip.end > 180000) G.trip = { start: now, m: 0, end: now }; log('driving'); }
  if (G.moving && G.slowSince && now - G.slowSince > 60000) { G.moving = false; log('parked'); }
  if (G.trip && G.moving) { G.trip.end = now; if (now - (G.subAt || 0) > 30000) { G.subAt = now; renderSub(); } }
  if (f.acc < 3000) {
    const a = { lat: Math.round(f.lat * 100) / 100, lon: Math.round(f.lon * 100) / 100 };   // ~1 km: enough for sun and weather
    if (!area || area.lat !== a.lat || area.lon !== a.lon) { area = a; store.set('area', a); renderSub(); applyTheme(); }
    if (!WX.at || Date.now() - WX.at > 15 * 60000) weather();
  }

}
const fresh = () => G.fix && Date.now() - G.fix.t < 8000;
function mode() {                                    // what TARS is told: unknown counts as driving (short replies)
  if (appMode() === 'home') return 'home';
  if (fresh()) return G.moving ? 'driving' : 'parked';
  return G.manual || 'driving';
}
const driving = () => fresh() && G.moving;
function renderSpeed() {
  const f = G.fix, ok = fresh() && f.spd != null;
  $('#spd').textContent = ok ? Math.round(f.spd * 3.6) : '–';
  const m = $('#mode');
  if (fresh()) { m.textContent = G.moving ? 'Driving' : 'Parked'; m.className = 'mono' + (G.moving ? ' driving' : ''); }
  else { m.textContent = G.manual ? (G.manual === 'parked' ? 'Parked' : 'Driving') + ' *' : (G.denied ? 'GPS off' : 'No GPS'); m.className = 'mono' + (G.manual === 'driving' ? ' driving' : ''); }
  // stopped (or at home): the speed gives way to the Home / Drive switch
  const home = appMode() === 'home';
  $('#app').classList.toggle('stopped', home || !driving());
  renderDash();
  const b = $('#modebtn'), key = home ? 'h' : 'd';
  if (b.dataset.k !== key) { b.dataset.k = key; b.innerHTML = `${icon(home ? 'car' : 'home')}<span>${home ? 'Drive' : 'Home'}</span>`; b.setAttribute('aria-label', home ? 'Drive mode' : 'Home mode'); }
}

// ---------- weather (Open-Meteo, no key; the location is rounded to ~1 km) ----------
const WX = store.get('wx', { at: 0, now: null });
const WMO = c => c === 0 ? ['sun', 'Clear'] : c <= 2 ? ['pcloud', c === 1 ? 'Mostly clear' : 'Partly cloudy'] : c === 3 ? ['cloud', 'Overcast']
  : c <= 48 ? ['fog', 'Fog'] : c <= 67 || (c >= 80 && c <= 82) ? ['rain', c >= 80 ? 'Showers' : c <= 57 ? 'Drizzle' : 'Rain'] : c <= 77 ? ['cloud', 'Snow'] : ['storm', 'Thunderstorms'];
let wxBusy = false;
async function weather() {
  if (wxBusy || !area || !navigator.onLine) return;
  wxBusy = true;
  try {
    const q = `latitude=${area.lat}&longitude=${area.lon}&timezone=auto&current=temperature_2m,weather_code,is_day,precipitation&minutely_15=precipitation&forecast_minutely_15=8&hourly=precipitation_probability&forecast_hours=3`;
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 12000);

// Check this phone: prove on the real iPhone that the camera records, and keeps recording while TARS has the microphone
function camProbe(blob) {

  }

      await sleep(1500);

function camBoot() {
  camReady = (async () => {
    try {
      CAM.db = await camOpenDb();
      CAM.segs = (await idb(camOS('seg').getAll())).sort((a, b) => a.id - b.id);
      CAM.saves = await idb(camOS('saves').getAll());
      const keys = await idb(camOS('log').getAllKeys());
      if (keys.length > 5000) { const t = CAM.db.transaction('log', 'readwrite'); keys.slice(0, keys.length - 4000).forEach(k => t.objectStore('log').delete(k)); await idbDone(t); }
      CAM.log = (await idb(camOS('log').getAll())).slice(-1000);

    } catch (e) { CAM.db = null; CAM.dbErr = (e && e.message) || String(e); log('dash cam storage: ' + CAM.dbErr); }
    await camQuota();
  })();
  camReady.then(() => {
    if (CAM.db) camLog(`app opened v${VERSION}, ${CAM.segs.length} segments, ${CAM.saves.length} saves${standalone() ? ', home screen app' : ''}`);
    camUi();
    if (camCfg.on && document.visibilityState === 'visible') camStartWhenSure();
    camSyncLoop();
  });
  setInterval(() => { if (CAM.on && MO.ok) camLog(`motion peak last minute ${MO.peak.toFixed(2)} g`); MO.peak = 0; }, 60000);
  setInterval(camQuota, 300000);

  // (no prompt when it was allowed before).
  document.addEventListener('click', () => { if (camCfg.on && camCfg.impact && !MO.ok && !MO.denied && !MO.tapAsked && store.get('camMotion', false)) { MO.tapAsked = true; camAskMotion(); } }, true);
  window.addEventListener('pagehide', camHidden);
}

// ---------- Home mode: the phone on its stand at home ----------
// The same TARS, the same turn engine, a different screen: Gargantua in the middle (tap it and talk), the weather and the

      { label: 'Reset', hot: true, run: () => { try { Object.keys(localStorage).filter(k => k.startsWith('drive.')).forEach(k => localStorage.removeItem(k)); } catch {} location.reload(); } }]);
  },
  setup(B) {

    B.innerHTML = s.map((x, i) => `<div class="step${x.done ? ' done' : ''}"><div class="num">${x.done ? '✓' : i + 1}</div><div class="grow"><div class="t" style="font-weight:700">${esc(x.title)}</div>
      <p class="note">${esc(x.text)}</p>${x.done ? '' : `<div class="acts"><button class="btn small hot" data-step="${x.id}">${{ install: 'How', check: 'Check now', places: 'Add places', link: 'Link', spotify: 'Set up', cam: 'Turn on' }[x.id]}</button></div>`}</div></div>`).join('')
      + `<div class="card" style="margin-top:14px"><h3>Hey Siri, TARS (optional, after the link works)</h3><p>Talk to TARS without touching the screen, from the lock screen too. In the Shortcuts app, make a new shortcut called <b>TARS</b>:</p>
        <ol class="how"><li><b>Dictate Text</b> (Stop Listening: After Pause)</li>
        <li><b>Get Contents of URL</b>: <span style="-webkit-user-select:all;user-select:all">${esc((pcBase() || 'https://pc-name.tailnet.ts.net/car') + '/say?format=mp3')}</span>, Method POST, Request Body JSON with <b>text</b> = Dictated Text and <b>mode</b> = driving</li>
        <li><b>Play Sound</b> with the Contents of URL</li></ol>
        <p>Then say “Hey Siri, TARS”. If Play Sound gives you trouble, use <b>/say?format=json</b>, then Get Dictionary Value <b>reply</b>, then <b>Speak Text</b>.</p></div>
        <div class="acts"><button class="btn small" id="shide">Hide the setup bar</button></div>`;
    B.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
      const id = b.dataset.step;
      if (id === 'install') modal('Add to Home Screen', 'Open this page in Safari, tap Share (the square with the arrow), then Add to Home Screen. Open TARS from the new icon.', [{ label: 'OK', hot: true }]);
      if (id === 'check') openSheet('check');
      if (id === 'places') openSheet('places', { add: 'home' });
      if (id === 'link' || id === 'spotify') openSheet('settings');

function spText() {

  if (SP.connected) return `Linked ✓${SP.now && SP.now.active ? ` · ${SP.now.track}${SP.now.device && SP.now.device.name ? ' on ' + SP.now.device.name : ''}` : ''}`;

function mapsNote() {
  if (cfg.maps === 'apple') return 'Apple Maps is built into the iPhone, so GO always opens it.';

function linkText() {

// ---------- check this phone (prove each piece on the real phone) ----------
function setCheck(id, ok, detail) { checks[id] = { ok, detail: detail || '', at: Date.now() }; store.set('checks', checks); if (sheetName === 'check') renderSheet(); renderSetupBar(); }
const LINK_TESTS = [
  ['l_gapp', 'Google Maps (app link)', () => mapsLink('google', 'app', { q: 'petrol station' }), 'google', 'app'],
  ['l_gweb', 'Google Maps (web link)', () => mapsLink('google', 'web', { q: 'petrol station' }), 'google', 'web'],
  ['l_wapp', 'Waze (app link)', () => mapsLink('waze', 'app', { q: 'petrol station' }), 'waze', 'app'],
  ['l_wweb', 'Waze (web link)', () => mapsLink('waze', 'web', { q: 'petrol station' }), 'waze', 'web'],
  ['l_aweb', 'Apple Maps', () => mapsLink('apple', 'web', { q: 'petrol station' }), 'apple', 'web'],
  ['l_sapp', 'Spotify (app link)', () => 'spotify:', 'spotify', 'app'],
  ['l_sweb', 'Spotify (web link)', () => 'https://open.spotify.com/', 'spotify', 'web'],
  ['l_tg', 'Telegram', () => 'tg://', null, null],
];
const pendingLink = { id: null, at: 0 };
function renderChecks(B) {
  const badge = id => { const c = checks[id]; return !c ? '<span class="badge">—</span>' : c.ok == null ? '<span class="badge">…</span>' : `<span class="badge ${c.ok ? 'ok' : 'bad'}">${c.ok ? 'OK' : 'NO'}</span>`; };
  const det = id => checks[id] && checks[id].detail ? `<div class="s">${esc(checks[id].detail)}</div>` : '';
  const row = (id, title, btn) => `<div class="row"><div class="grow"><div class="t">${esc(title)}</div>${det(id)}</div>${badge(id)}${btn ? `<button class="btn small" data-run="${id}">${btn}</button>` : ''}</div>`;
  B.innerHTML = `
    <div class="card"><h3>Sound and voice</h3><p>Turn the volume up. The speaker test plays TARS’s real voice.</p>
      ${row('speaker', 'Speaker', 'Play')}${row('mic', 'Microphone', 'Test')}<div class="meter" id="mmeter"><i></i></div>${row('speaker2', 'Speaker after the mic', 'Play')}</div>
    <div class="card"><h3>This phone</h3>${row('install', 'Running from the Home Screen', '')}${row('gps', 'Location and speed', 'Test')}${row('wake', 'Screen stays on', 'Test')}${row('storage', 'Storage kept', 'Test')}${row('pc', 'TARS link', pcBase() ? 'Test' : '')}</div>
    <div class="card"><h3>Dash cam</h3><p>Point the back camera at something. The second test opens the microphone in the middle of a recording, the way tapping TARS does.</p>
      ${row('cam', 'Back camera records', 'Test')}${row('cammic', 'Camera keeps going while TARS listens', 'Test')}${row('camstore', 'Room for footage', 'Test')}</div>
    <div class="card"><h3>Apps that open from here</h3><p>Each one opens a search for a petrol station. Come back with the ◀ TARS link in the corner, then say if it worked.</p>
      ${LINK_TESTS.map(([id, title]) => row(id, title, 'Open')).join('')}</div>
    <div class="acts"><button class="btn hot" id="cauto">Run the automatic ones</button><button class="btn" id="creport">Send the results to the PC</button><button class="btn" id="cshare">Share</button></div>
    <p class="note" id="cmsg"></p>`;
  if (!checks.install) setCheck('install', standalone(), standalone() ? '' : 'Open it from the Home Screen icon');
  B.querySelectorAll('[data-run]').forEach(b => b.onclick = () => runCheck(b.dataset.run));
  $('#cauto', B).onclick = () => Promise.all(['gps', 'wake', 'storage', 'camstore', ...(pcBase() ? ['pc'] : [])].map(id => runCheck(id)));
  $('#creport', B).onclick = async () => {
    const m = $('#cmsg', B);
    if (!pcBase()) { m.textContent = 'Link TARS first (Settings).'; return; }
    try {
      const r = await fetch(`${pcBase()}/report`, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(report()), cache: 'no-store' });
      m.textContent = r.ok ? 'Sent. TARS can read it now.' : 'The PC said ' + r.status;
    } catch { m.textContent = 'Couldn’t reach the PC.'; }
  };
  $('#cshare', B).onclick = async () => { const text = JSON.stringify(report(), null, 1); try { await navigator.share({ title: 'TARS Drive check', text }); } catch { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch {} } };
}
function report() {
  return { app: VERSION, at: new Date().toISOString(), ua: navigator.userAgent, standalone: standalone(), screen: `${screen.width}x${screen.height}@${devicePixelRatio}`,
    checks, maps: cfg.maps, links: { google: linkMethod('google'), waze: linkMethod('waze'), spotify: linkMethod('spotify') }, places: places.length, pinned: music.length, mime: pickAudioMime(), log: LOG.slice(-60),
    cam: camReport(), camLog: CAM.log.slice(-60), mode: appMode(), homeSpot: !!homeSpot(), hole: HOLE.gl ? 'webgl' : HOLE.fail ? 'flat' : 'off' };
}
async function runCheck(id) {
  const LT = LINK_TESTS.find(x => x[0] === id);
  if (LT) { pendingLink.id = id; pendingLink.at = Date.now(); openExternal(LT[2]()); setTimeout(() => { if (pendingLink.id === id && document.visibilityState === 'visible') askLink(); }, 4000); return; }
  if (id === 'speaker' || id === 'speaker2') {
    unlockAudio();
    voiceEl.src = 'tars-check.mp3';
    try { await voiceEl.play(); } catch (e) { setCheck(id, false, 'Blocked: ' + e.name); return; }
    voiceEl.onended = () => {
      voiceEl.onended = null;
      modal(id === 'speaker' ? 'Did you hear TARS?' : 'Was TARS loud and clear?', id === 'speaker' ? 'It said “Speaker check”.' : 'Not quiet like a phone call through the earpiece.', [
        { label: 'No', run: () => setCheck(id, false, id === 'speaker' ? 'No sound' : 'Too quiet or from the earpiece') },
        { label: 'Yes', hot: true, run: () => setCheck(id, true) }]);
    };
    return;
  }
  if (id === 'mic') return micTest();
  if (id === 'cam' || id === 'cammic' || id === 'camstore') return camCheck(id);
  if (id === 'gps') {
    const say = (acc, spd) => setCheck('gps', acc < 100, `±${Math.round(acc)} m, speed ${spd == null ? 'not reported (worked out from movement)' : 'reported'}`);
    if (fresh()) { say(G.fix.acc, G.fix.spd); return; }        // the live fix the app already has
    setCheck('gps', false, 'Waiting for a fix…');
    return new Promise(done => navigator.geolocation.getCurrentPosition(p => { say(p.coords.accuracy, p.coords.speed); onFix(p); done(); },
      e => { setCheck('gps', false, e.code === 1 ? 'Permission denied' : e.code === 3 ? 'No fix in 15 s: go outside and try again' : e.message); done(); },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }));
  }
  if (id === 'wake') {
    if (!('wakeLock' in navigator)) { setCheck('wake', false, 'Not supported: set Auto-Lock to Never in Settings'); return; }
    try { const w = await navigator.wakeLock.request('screen'); setCheck('wake', true, 'Held while TARS is open'); if (!wake) { wake = w; w.addEventListener('release', () => { wake = null; }); } else w.release(); }
    catch (e) { setCheck('wake', false, `${e.name}: set Auto-Lock to Never instead`); }
    return;
  }
  if (id === 'storage') {
    try { const p = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; setCheck('storage', true, p ? 'Kept for good' : 'iOS may clear it if the phone runs low'); }
    catch (e) { setCheck('storage', false, e.message); }
    return;
  }
  if (id === 'pc') { try { await hello(10000); setCheck('pc', true, `${L.rtt} ms`); } catch { setCheck('pc', false, L.err); } }
}
function askLink() {
  const id = pendingLink.id; pendingLink.id = null;
  const LT = LINK_TESTS.find(x => x[0] === id); if (!LT) return;
  modal(`Did ${LT[1].replace(/ \(.*\)/, '')} open?`, LT[1], [
    { label: 'No', run: () => setCheck(id, false) },
    { label: 'Yes', hot: true, run: () => { setCheck(id, true); renderTiles(); } }]);
}
let micT = null;
async function micTest() {
  stopMicTest();
  unlockAudio();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { setCheck('mic', false, e.name === 'NotAllowedError' ? 'Permission denied' : e.name); return; }
  const mime = pickAudioMime(), rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);
  let an = null, buf, peak = 0;
  try { const src = T.ctx.createMediaStreamSource(stream); an = T.ctx.createAnalyser(); an.fftSize = 1024; buf = new Float32Array(1024); src.connect(an); } catch {}
  micT = { stream, timer: setInterval(() => {
    if (!an) return; an.getFloatTimeDomainData(buf); let s = 0; for (const x of buf) s += x * x;
    const lv = clamp((20 * Math.log10(Math.sqrt(s / buf.length) + 1e-9) + 58) / 38, 0, 1); peak = Math.max(peak, lv);
    const m = $('#mmeter i'); if (m) m.style.width = (lv * 100).toFixed(0) + '%';
  }, 60) };
  toast('Say something for 3 seconds…');
  rec.onstop = () => {
    stopMicTest();
    const b = new Blob(parts, { type: rec.mimeType || 'audio/mp4' });
    voiceEl.src = URL.createObjectURL(b);
    voiceEl.play().catch(() => {});
    voiceEl.onended = () => { voiceEl.onended = null; modal('Did you hear yourself?', `Recorded ${(b.size / 1024).toFixed(0)} KB as ${b.type || 'audio'}${an ? `, loudest ${Math.round(peak * 100)}%` : ''}.`, [
      { label: 'No', run: () => setCheck('mic', false, 'Recorded but not heard back') },
      { label: 'Yes', hot: true, run: () => setCheck('mic', true, b.type) }]); };
  };
  rec.start(); setTimeout(() => { try { rec.stop(); } catch {} }, 3000);
}
function stopMicTest() { if (micT) { clearInterval(micT.timer); micT.stream.getTracks().forEach(t => t.stop()); micT = null; } }

// ---------- life cycle ----------
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    gpsOn(); wakeOn(); tick(); linkLoop(); musicSoon(SP.waitLink ? 800 : 300); camVisible();
    if (!WX.at || Date.now() - WX.at > 15 * 60000) weather();

  } else {
    gpsOff(); camHidden();
    if (T.st === 'listening') endListening('tap');
  }
});
['pointerdown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => wakeOn(), { passive: true, once: true }));
document.addEventListener('touchstart', () => {}, { passive: true });   // iOS only shows :active with a touch listener

  places = [{ id: 'h', name: 'Home', kind: 'home', q: 'Home' }, { id: 'w', name: 'Work', kind: 'work', q: 'Work' }, { id: 'g', name: 'Virgin Active', kind: 'gym', q: 'Gym' }];
  music = [{ id: 'm1', name: 'Night Drive', url: 'https://open.spotify.com/playlist/demo' }];

  area = { lat: -33.92, lon: 18.42 };
  G.fix = { t: Date.now() + 1e9, lat: 0, lon: 0, acc: 5, spd: 54 / 3.6 }; G.moving = true; G.trip = { start: Date.now() - 23 * 60000, m: 17400, end: Date.now() };
  L.ok = true; store.set('pc', 'demo.example.ts.net');

    last: { start: new Date(Date.now() - 2.5 * 3600e3).toISOString(), end: new Date(Date.now() - 2 * 3600e3).toISOString(), km: 14.2, min: 31 } } };

  else if (kind === 'thinking') { setState('thinking', 'Thinking'); setReply('…', 'hint'); }

    if (kind === 'speaking' || kind === 'night') { setState('speaking'); V.cur = { id: 0, env: Array.from({ length: 400 }, (_, i) => 0.3 + 0.6 * Math.abs(Math.sin(i / 2.3))), url: '' }; Object.defineProperty(voiceEl, 'currentTime', { get: () => (Date.now() / 1000) % 19 }); }
    else setState('idle');

  }

(function boot() {
  const root = document.documentElement;
  root.classList.toggle('fx', cfg.fx !== false);
  root.classList.add('boot'); setTimeout(() => root.classList.remove('boot'), 1600);
  applyTheme(); tick(); renderWx(); renderTiles(); renderQuick(); renderLink(); renderSpeed();
  setState('idle');
  if (convos[0] && Date.now() - convos[0].at < 6 * 3600e3) { $('#said').textContent = convos[0].heard ? `“${convos[0].heard}”` : ''; setReply(esc(convos[0].reply || 'Tap TARS and talk.'), 'hint'); }
  else setReply(pcBase() ? 'Tap TARS and talk.' : 'Tap TARS and talk. First, link it to the PC.', 'hint');
  setInterval(tick, 1000);
  requestAnimationFrame(animate);
  fitLayout();
  const d = /#demo(?:=(\w+))?/.exec(location.hash);
  setInterval(camTick, 500);
  if (d) { demo(d[1] || 'idle'); return; }
  setAppMode(MODE.cur, 'boot');
  camBoot();
  gpsOn(); linkLoop(); musicLoop();
  setInterval(() => { if (SP.connected && SP.now && SP.now.playing && document.visibilityState === 'visible') renderNow(); }, 1000);
  if (!WX.at || Date.now() - WX.at > 15 * 60000) weather();
  log(`opened v${VERSION}${standalone() ? ' (home screen)' : ''}${pcBase() ? ', linked' : ''}`);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => log('service worker: ' + e.message));
})();
