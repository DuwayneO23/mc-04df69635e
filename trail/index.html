<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1311">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trail">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trail Companion</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Field gear for a gorge: works offline, big targets for gloves, dark by default, a high-contrast "sun" theme for glare. */
:root {
  color-scheme: dark;
  --bg: #0e1311; --panel: #18201c; --panel2: #121915; --line: #2b3a32;
  --fg: #edf2ec; --muted: #a3b3a8; --faint: #71827a;
  --accent: #f2b84b; --accent-ink: #1c1405;
  --ok: #52c98e; --warn: #f2b84b; --bad: #f06b60;
  --water: #55b4ee; --trail: #e7c469; --sel: #ffffff; --road: #36423c; --bound: #6fbf8e;
  --track: #3de0ff; --mapbg: #0f1511; --me: #4d9bff;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabh: 64px;
}
:root[data-sun="1"] {
  color-scheme: light;
  --bg: #f6f2e7; --panel: #fffdf7; --panel2: #ece6d6; --line: #c9c0a8;
  --fg: #14201a; --muted: #43534a; --faint: #66766c;
  --accent: #a85400; --accent-ink: #ffffff;
  --ok: #0b7a46; --warn: #a85400; --bad: #b3261e;
  --water: #0b63b0; --trail: #8a4b00; --sel: #000000; --road: #cdc5b0; --bound: #2f7d4f;
  --track: #0077a8; --mapbg: #efe9d8; --me: #1a56db;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 var(--sans); display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  touch-action: manipulation; font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

.top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) 14px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand b { font-size: 16px; letter-spacing: .01em; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.topr { display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: var(--panel);
  border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }

main { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: none; overflow: hidden; }
.view.on { display: block; }
.scroll { overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px 24px; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 4px 2px 0; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.card h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-size: 24px; font-weight: 700; line-height: 1.15; margin-top: 2px; white-space: nowrap; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.big { font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 13px; }
.btn { min-height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 650;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none; color: var(--fg); }
.btn:active { transform: scale(.98); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.go { background: var(--ok); color: #04190e; border-color: transparent; }
.btn.stop { background: #d94a3d; color: #fff; border-color: transparent; }
.btn.wide { width: 100%; }
.btn.huge { min-height: 72px; font-size: 20px; border-radius: 18px; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: 14.5px; border-radius: 12px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; } .btns > .btn { flex: 1 1 140px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { padding: 9px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel2); font-size: 14.5px; font-weight: 600; }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 34px; }
input[type=time], input[type=number], input[type=text] { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-height: 44px; -webkit-user-select: text; user-select: text; }
.status { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
.status .badge { padding: 4px 12px; border-radius: 99px; font-weight: 800; font-size: 13px; letter-spacing: .08em; }
.status.ok { border-color: var(--ok); } .status.ok .badge { background: var(--ok); color: #04190e; }
.status.tight { border-color: var(--warn); } .status.tight .badge { background: var(--warn); color: var(--accent-ink); }
.status.turn { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, var(--panel)); } .status.turn .badge { background: var(--bad); color: #fff; }
.status.none .badge { background: var(--line); color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
td, th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; }
th { color: var(--muted); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
td:first-child, th:first-child { text-align: left; }

/* MAP */
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; background: var(--mapbg); display: block; }
.mapchips { position: absolute; left: 10px; top: 10px; right: 64px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; }
.mapchips .chip { pointer-events: auto; background: color-mix(in srgb, var(--panel) 92%, transparent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.mapctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; }
.mapctl button { width: 46px; height: 46px; border-radius: 50%; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 24px; font-weight: 500; box-shadow: 0 2px 8px #0005; }
.mapctl button svg { width: 22px; height: 22px; }
.mapctl button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.scalebar { position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: var(--fg); pointer-events: none; text-shadow: 0 0 3px var(--mapbg), 0 0 3px var(--mapbg); }
.scalebar i { display: block; height: 6px; border: 2px solid var(--fg); border-top: 0; margin-bottom: 2px; }
.mapinfo { position: absolute; left: 10px; right: 10px; bottom: 10px; background: color-mix(in srgb, var(--panel) 96%, transparent);
  border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 20px #0006; display: none; }
.mapinfo.on { display: block; }
.mapinfo b { font-size: 17px; } .mapinfo .x { position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; font-size: 22px; color: var(--muted); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 72%; background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
  box-shadow: 0 -10px 30px #0007; transform: translateY(105%); visibility: hidden; transition: transform .22s ease, visibility .22s; display: flex; flex-direction: column; z-index: 5; }
.sheet.on { transform: none; visibility: visible; }
.sheet .hd { display: flex; gap: 8px; align-items: center; padding: 12px 14px 8px; }
.sheet .hd .grow { flex: 1; display: flex; gap: 8px; }
.sheet .list { overflow-y: auto; padding: 0 8px 16px; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); min-height: 52px; }
.li .t { font-weight: 600; } .li .s { color: var(--muted); font-size: 13px; }
.li .r { color: var(--muted); font-size: 14px; white-space: nowrap; }

/* REC */
.timer { font-size: 56px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.arrow { width: 54px; height: 54px; flex: none; }
.bignote { font-size: 13px; color: var(--muted); }

/* SOS */
.coords { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1.25; -webkit-user-select: text; user-select: text; word-break: break-word; }
.call { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--panel2);
  border: 1px solid var(--line); text-decoration: none; color: var(--fg); min-height: 60px; }
.call b { font-size: 17px; } .call span { color: var(--muted); font-size: 13px; display: block; font-weight: 400; }
.call .n { font-family: var(--mono); font-weight: 800; font-size: 18px; color: var(--accent); }
.script { font-size: 15px; line-height: 1.5; -webkit-user-select: text; user-select: text; }

/* TABBAR */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--bg);
  padding-bottom: env(safe-area-inset-bottom); }
.tabbar button { height: var(--tabh); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted);
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; position: relative; }
.tabbar svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--accent); }
.tabbar button.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tabbar .recdot { position: absolute; top: 9px; right: calc(50% - 20px); width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: none; animation: pulse 1.2s infinite; }
.tabbar .recdot.on { display: block; }

/* overlays */
#saver { position: fixed; inset: 0; background: #000; color: #5b6b62; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
#saver.on { display: flex; }
#saver .t { font-size: 54px; font-weight: 700; color: #7f9187; } #saver .s { font-size: 20px; }
#flash { position: fixed; inset: 0; z-index: 60; display: none; background: #000; color: #000; align-items: flex-end; justify-content: center; padding-bottom: 60px; font-weight: 800; }
#flash.on { display: flex; }
#toast { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 14px); z-index: 70; display: flex; justify-content: center; pointer-events: none; }
#toast div { background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14.5px; max-width: 520px; box-shadow: 0 6px 20px #0008; }
#demoban { display: none; background: var(--warn); color: var(--accent-ink); text-align: center; font-weight: 800; font-size: 12.5px; letter-spacing: .08em; padding: 5px; text-transform: uppercase; }
#demoban.on { display: block; }
#dbg { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 99; background: #b3261e; color: #fff; font: 12px var(--mono); padding: 6px; white-space: pre-wrap; max-height: 40%; overflow: auto; }
svg text { font-family: var(--sans); }
@media (min-width: 760px) { .scroll { padding: 22px; } }
@media (prefers-reduced-motion: reduce) { .dot.pulse, .tabbar .recdot { animation: none; } .sheet { transition: none; } }
</style>
</head>
<body>
<div id="demoban">Demo walk &middot; fake GPS &middot; <button data-act="demo-stop" style="text-decoration:underline;font-weight:800">stop</button></div>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#18201c"/><path d="M4 25l8-12 4 6 3-4 9 10z" fill="#f2b84b"/><circle cx="23" cy="9" r="2.6" fill="#55b4ee"/></svg>
    <div><b>Trail Companion</b><br><small>Krantzkloof</small></div>
  </div>
  <div class="topr">
    <span class="chip" id="gpschip"><i class="dot pulse"></i><span>GPS&hellip;</span></span>
    <button class="iconbtn" data-act="sun" aria-label="Toggle sun mode (high contrast)" title="Sun mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="view on" id="v-map">
    <canvas id="cv"></canvas>
    <div class="mapchips"><span class="chip" id="trailchip">Tap a trail or place</span></div>
    <div class="mapctl">
      <button data-act="locate" id="locbtn" aria-label="Centre on me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
      <button data-act="zin" aria-label="Zoom in">+</button>
      <button data-act="zout" aria-label="Zoom out">&minus;</button>
      <button data-act="fit" aria-label="Show whole reserve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button data-act="list" aria-label="Trails and places"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    </div>
    <div class="scalebar" id="scalebar"></div>
    <div class="mapinfo" id="mapinfo"></div>
    <div class="sheet" id="sheet">
      <div class="hd"><div class="grow"><button class="pill on" data-act="sheet-tab" data-v="trails">Trails</button><button class="pill" data-act="sheet-tab" data-v="places">Places</button></div>
        <button class="btn sm" data-act="sheet-close">Close</button></div>
      <div class="list" id="sheetlist"></div>
    </div>
  </section>

  <section class="view scroll" id="v-clock"><div class="wrap" id="clockin"></div></section>
  <section class="view scroll" id="v-rec"><div class="wrap" id="recin"></div></section>
  <section class="view scroll" id="v-sos"><div class="wrap" id="sosin"></div></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <button class="on" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <button data-tab="clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M6.5 18a5.5 5.5 0 0111 0"/><path d="M12 5v3M4.6 9.6l2 1.6M19.4 9.6l-2 1.6"/></svg>Daylight</button>
  <button data-tab="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>Record<i class="recdot" id="recdot"></i></button>
  <button data-tab="sos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 21h20z"/><path d="M12 10v5M12 18h.01"/></svg>Help</button>
</nav>

<div id="saver" data-act="saver-off"><div class="t" id="sv-t">0:00:00</div><div class="s" id="sv-s"></div><div class="small" style="margin-top:24px">Still recording. Tap anywhere to wake.</div></div>
<div id="flash" data-act="flash-off"><span id="flashtxt"></span></div>
<div id="toast"></div>
<pre id="dbg"></pre>

  if (full || !$('#s-live')) {
    host.innerHTML = `<h1>Help</h1>
    <div class="card"><h2>Where you are</h2><div id="s-live">${live}</div>
      <div class="btns" style="margin-top:12px"><button class="btn pri" data-act="sos-share">Share my location</button><button class="btn" data-act="sos-copy">Copy</button></div></div>
    <div class="card"><h2>Call for help</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a class="call" href="tel:112"><div><b>Emergency (any network)</b><span>Works on a cellphone even without airtime, and may work with another network if yours has no signal.</span></div><div class="n">112</div></a>
        <a class="call" href="tel:084124"><div><b>ER24</b><span>Ambulance, private</span></div><div class="n">084 124</div></a>
        <a class="call" href="tel:082911"><div><b>Netcare 911</b><span>Ambulance, private</span></div><div class="n">082 911</div></a>
        <a class="call" href="tel:10111"><div><b>Police</b><span>SAPS</span></div><div class="n">10111</div></a></div>
      <div class="small faint" style="margin-top:10px">Numbers as I know them. Save the ones you rely on in your contacts before the hike. In the gorge, climbing to open ground often gets signal back.</div></div>
    <div class="card"><h2>What to say</h2><div class="script" id="s-say">${esc(say)}</div></div>
    <div class="card"><h2>Be seen and heard</h2>
      <div class="btns"><button class="btn ${whistleT ? 'stop' : ''}" data-act="whistle">${whistleT ? 'Stop whistle' : 'Whistle'}</button><button class="btn" data-act="flash">SOS light</button><button class="btn" data-act="torch">Torch</button></div>
      <div class="small faint" style="margin-top:10px">The whistle gives six blasts a minute, the standard distress signal, then a minute of quiet. A phone is a weak backup for a real whistle. The SOS light flashes the screen in morse. Torch uses the phone’s light where the browser allows it, otherwise a white screen.</div></div>
    <div class="card"><h2>Settings</h2>
      <div class="btns"><button class="btn sm" data-act="sun">Sun / dark mode</button><button class="btn sm" data-act="demo-start">Try a demo walk</button></div>
      <div class="small faint" id="s-off" style="margin-top:10px"></div>
      <div class="small faint" style="margin-top:6px">Trails, water and places: © OpenStreetMap contributors. Sun times are calculated on the phone. This is a helper, not a replacement for a proper map, a charged phone and telling someone your plan.</div></div>`;
    $('#s-off').textContent = offlineMsg();
  } else {
    setHTML($('#s-live'), live); const sy = $('#s-say'); if (sy && sy.textContent !== say) sy.textContent = say;
  }
  S.sosLink = link; S.sosText = p ? `I need help. Krantzkloof Nature Reserve. ${where}. My location: ${link}` : '';
}
let swState = '';
const offlineMsg = () => swState === 'ready' ? 'Offline ready: this page and the map are saved on your phone.' : swState === 'unsupported' ? 'Offline saving is not available when opened as a file. Open it from the web link once.' : 'Saving for offline use… open this page once with signal, then add it to your home screen.';

/* ---------- demo ---------- */
function demoStart() {
  const g = [...GROUPS.values()].filter(x => x.name).sort((a, b) => b.len - a.len)[0]; const seg = g.segs.reduce((a, b) => plen(a.pts) > plen(b.pts) ? a : b);
  const route = seg.pts.concat([...seg.pts].reverse()); const cum = [0]; for (let i = 1; i < route.length; i++) cum.push(cum[i - 1] + dist(route[i - 1], route[i]));
  let m = 0; S.demo = setInterval(() => {
    m = (m + 18) % cum[cum.length - 1]; let i = 1; while (i < cum.length - 1 && cum[i] < m) i++;
    const f = (m - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1), x = route[i - 1][0] + f * (route[i][0] - route[i - 1][0]), y = route[i - 1][1] + f * (route[i][1] - route[i - 1][1]);
    const [lat, lon] = [MAP.lat0 + y / KY, MAP.lon0 + x / KX]; feed({ lat, lon, acc: 6 + Math.random() * 4, alt: 180 + 60 * Math.sin(m / 300) + Math.random() * 3, t: Date.now() });
  }, 1000); $('#demoban').classList.add('on'); toast('Demo walk started: fake GPS, not your real position'); updateChip();
}
function demoStop() { clearInterval(S.demo); S.demo = null; $('#demoban').classList.remove('on'); S.pos = null; S.gpsState = 'wait'; prevXY = null; travelHdg = null; updateChip(); refreshMapInfo(); req(); }

/* ---------- actions ---------- */
document.addEventListener('pointerdown', () => { audio(); }, { once: true, passive: true });
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.dataset.tab); return; }
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  const ACT = {
    sun: () => applySun(!root.hasAttribute('data-sun')),
    locate: () => { if (S.pos) { cam.x = S.pos.xy[0]; cam.y = S.pos.xy[1]; if (cam.s < 0.4) cam.s = 0.6; S.follow = true; userMoved = true; req(); } else toast(S.gpsState === 'denied' ? 'Location is blocked. Allow it in the browser’s site settings.' : 'Still finding you…'); },
    zin: () => { zoomAt(W / 2, H / 2, 1.6); userMoved = true; S.follow = false; req(); }, zout: () => { zoomAt(W / 2, H / 2, 1 / 1.6); userMoved = true; S.follow = false; req(); },
    fit: () => { fitBB(RES_BB, 20); S.follow = false; S.sel = null; refreshMapInfo(); req(); },
    list: () => { renderSheet(); $('#sheet').classList.add('on'); }, 'sheet-close': () => $('#sheet').classList.remove('on'),
    'sheet-tab': () => { S.sheetTab = b.dataset.v; renderSheet(); },
    'pick-trail': () => { S.sel = { type: 'trail', name: b.dataset.n }; $('#sheet').classList.remove('on'); selFit(); refreshMapInfo(); },
    'pick-poi': () => { S.sel = { type: 'poi', i: +b.dataset.i }; $('#sheet').classList.remove('on'); selFit(); refreshMapInfo(); },
    selfit: selFit, selclear: () => { S.sel = null; refreshMapInfo(); req(); },
    mode: () => { S.mode = b.dataset.v; store.set('tc-mode', S.mode); renderClock(true); },
    'copy-plan': () => copy(whatsappText(plan())),
    start: recStart, pause: recPause,
    finish: () => { if (!S.finishArmed) { S.finishArmed = true; $('#finbtn').textContent = 'Tap again to finish'; setTimeout(() => { S.finishArmed = false; const x = $('#finbtn'); if (x) x.textContent = 'Finish'; }, 4000); } else recFinish(); },
    pinmenu: () => { const p = $('#pins'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }, pin: () => { addPin(b.dataset.n); },
    saver: () => { $('#saver').classList.add('on'); wakeOn(); }, 'saver-off': () => $('#saver').classList.remove('on'),
    'open-hike': () => { S.viewing = hikes.find(h => h.id == b.dataset.id); renderRec(true); $('#v-rec').scrollTop = 0; },
    'close-hike': () => { S.viewing = null; renderRec(true); req(); },
    'del-hike': () => { if (b.dataset.sure) { hikes = hikes.filter(h => h.id !== S.viewing.id); store.set('tc-hikes', hikes); S.viewing = null; renderRec(true); req(); } else { b.dataset.sure = 1; b.textContent = 'Tap again to delete'; } },
    'share-gpx': () => shareGpx(S.viewing), 'share-text': () => shareText(hikeText(S.viewing)),
    'sos-share': () => shareText(S.sosText || 'I need help at Krantzkloof Nature Reserve.'), 'sos-copy': () => copy(S.sosText || ''),
    whistle: () => { whistle(!whistleT); renderSOS(true); }, flash: () => flashSOS(true), 'flash-off': () => { flashSOS(false); torch(false); $('#flash').classList.remove('on'); },
    torch: async () => { const ok = await torch(true); if (ok) toast('Torch on. Tap Torch again to turn off.'); },
    'demo-start': () => { if (!S.demo) demoStart(); setTab('map'); }, 'demo-stop': demoStop
  };
  if (a === 'torch' && torchTrack) { torch(false); toast('Torch off'); return; }
  (ACT[a] || (() => {}))();
});
async function shareText(t) { try { if (navigator.share) { await navigator.share({ text: t }); return; } } catch (e) { if (e && e.name === 'AbortError') return; } copy(t); }
async function copy(t) { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch { toast('Could not copy'); } ta.remove(); } }
document.addEventListener('input', e => {
  const id = e.target.id; if (id === 'rgBuf') { S.buffer = +e.target.value; store.set('tc-buffer', S.buffer); $('#bufv').textContent = S.buffer; renderClockLive(); }
  else if (id === 'rgSlow') { S.slow = +e.target.value; store.set('tc-slow', S.slow); $('#slowv').textContent = '+' + S.slow + '%'; renderClockLive(); }
  else if (id === 'inStart') { S.planStart = e.target.value; store.set('tc-start', S.planStart); renderClockLive(); }
  else if (id === 'inRem') { S.remaining = e.target.value; store.set('tc-remaining', S.remaining); renderClockLive(); }
  else if (id === 'inBack') { S.backBy = e.target.value; store.set('tc-backby', S.backBy); renderClockLive(); }
});
const renderClockLive = () => renderClock(false);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (rec && rec.state === 'run') wakeOn(); resize(); } else persist(true); });
window.addEventListener('pagehide', () => persist(true));
window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ---------- boot ---------- */
setInterval(() => {
  updateChip(); if (rec && rec.state === 'run') { rec.stats = rec.stats || computeStats(rec.pts); if (Date.now() - (rec.lastSave || 0) > 15000) persist(); }
  if (S.tab !== 'map') renderLive();
  if ($('#saver').classList.contains('on') && rec) { const s = recStats(); $('#sv-t').textContent = hms(elapsed(rec)); $('#sv-s').textContent = `${distStr(s.dist)} · ${hm(new Date())}`; }
  if (S.tab === 'map' && S.follow) req();
}, 1000);
window.addEventListener('error', e => { const d = $('#dbg'); d.style.display = 'block'; d.textContent += `${e.message} @${e.lineno}:${e.colno}\n`; });
window.addEventListener('unhandledrejection', e => { const d = $('#dbg'); d.style.display = 'block'; d.textContent += `promise: ${e.reason}\n`; });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { swState = 'ready'; const o = $('#s-off'); if (o) o.textContent = offlineMsg(); }).catch(() => { swState = 'err'; });
} else swState = 'unsupported';

applySun(store.get('tc-sun', 0) === 1); readColors();
if (rec) { if (rec.state === 'run') { rec.accum += Date.now() - rec.segStart; rec.segStart = Date.now(); rec.resume = true; wakeOn(); } setDot(); }   // page was reloaded mid-hike: carry on, counting the gap as hiking time
startGPS();
resize(); fitBB(RES_BB, 20);
const h0 = (location.hash || '').replace('#', '').split('&');
if (['map', 'clock', 'rec', 'sos'].includes(h0[0])) setTab(h0[0]);
if (h0.includes('demo')) demoStart();
if (h0.includes('autorec') && !rec) setTimeout(recStart, 800);                        // test hooks, used by headless QA only
const fin = h0.find(x => x.startsWith('fin=')); if (fin) setTimeout(() => { recFinish(); }, +fin.slice(4));
if (h0.includes('sun')) applySun(true);
updateChip(); refreshMapInfo();
</script>
</body>
</html>
